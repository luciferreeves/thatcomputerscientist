{% load i18n %}
<tbody data-has-more="{{ has_more|yesno:'true,false' }}" {% if letters %}data-oldest-id="{{ letters.0.pk }}"{% endif %}>
{% for letter in letters %}
<tr class="letter-note {% if letter.sender == request.user %}from-self{% else %}from-other{% endif %}" data-letter-id="{{ letter.pk }}">
    <td class="letter-gutter">
        <div class="letter-stamp">{{ letter.created_at|date:"H:i" }}</div>
        <div class="letter-sender">{% if letter.sender == request.user %}{% trans "You" %}{% else %}{{ letter.sender.username }}{% endif %}</div>
    </td>
    <td class="letter-body">{{ letter.content|safe }}</td>
</tr>
{% endfor %}
</tbody>
